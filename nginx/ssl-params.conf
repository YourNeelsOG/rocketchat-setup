# Shared TLS settings, included by the public-tls and local-tls templates.
#
# Included by absolute path from outside /etc/nginx/conf.d so that nginx's own
# `include /etc/nginx/conf.d/*.conf` does not try to load it as a standalone
# configuration file, which would fail because it contains no server block.
#
# HSTS is deliberately NOT set here. It belongs only in the configuration that
# runs once a trusted certificate exists; see the public-tls template.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

ssl_session_timeout 1d;
ssl_session_cache shared:RocketChatTLS:10m;
ssl_session_tickets off;

# OCSP stapling is configured in the public-tls template only. Self-signed
# certificates have no OCSP responder, so enabling it here would spam nginx
# error logs in local-tls mode.

add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header X-XSS-Protection          "0" always;

# Rocket.Chat serves its own application shell; a restrictive CSP here breaks
# the client. Content security is configured in the Rocket.Chat admin panel.

server_tokens off;
